name: Hide interactive UI in print

on:
  push:
    branches: [fix/pdf-print-layout]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch print CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('styles.css')
          s=p.read_text(encoding='utf-8')
          marker='/* v3.1.19 print interaction cleanup */'
          if marker not in s:
              s += '''\n\n/* v3.1.19 print interaction cleanup */\n@media print{\n  .no-print-ui{display:none!important}\n}\n'''
              p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          node --check app.js
          python tests/validate_packs.py
          node tests/projection_regression.cjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          git commit -m "fix: hide interactive plan controls in PDF output [skip ci]" || exit 0
          git push
