name: Apply mobile UX 3.3.0

on:
  push:
    branches: ['ux/mobile-3.3.0']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply mobile UX changes
        run: |
          python tests/apply_mobile_ux.py
          python tests/release_maintenance.py

      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check mobile.js

      - name: Data and markup validation
        run: python tests/validate_packs.py | tee validation.log

      - name: Application regression
        run: node tests/projection_regression.cjs | tee application.log

      - name: Generate regression report
        run: python tests/generate_regression_report.py --validation-log validation.log --application-log application.log

      - name: Mobile sanity checks
        run: |
          grep -q 'mobile.js?v=3.3.0' index.html
          grep -q 'id="mobileImportGuide"' index.html
          grep -q 'mobileHistoryCards' mobile.js
          grep -q 'mobilePlanCards' mobile.js
          grep -q 'mobilePlanCoursePicker' mobile.js
          grep -q 'body.mobile-mode' styles.css
          grep -q "RELEASE_VERSION = '3.3.0'" tests/release_maintenance.py
          git diff --check -- index.html styles.css app.js mobile.js data-pack.json rules-pack.json certificate-rules.json tests/release_maintenance.py tests/validate_packs.py

      - name: Remove one-time migration files
        run: |
          git checkout -- .github/workflows/validate.yml
          rm -f tests/apply_mobile_ux.py
          rm -f .github/workflows/mobile-ux-3.3.0.yml
          rm -f validation.log application.log

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add mobile-first presentation and import guidance [skip ci]"
          git push
