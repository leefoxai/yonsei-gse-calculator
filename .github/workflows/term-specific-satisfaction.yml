name: Term-specific satisfaction

on:
  push:
    branches: ['fix/term-specific-satisfaction']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python tests/apply_term_status_patch.py
      - name: JavaScript syntax
        run: node --check app.js
      - name: Data validation
        run: python tests/validate_packs.py
      - name: Application regression
        run: node tests/projection_regression.cjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js tests/projection_regression.cjs
          git commit -m "fix: show semester-specific satisfaction timing [skip ci]"
          git push
