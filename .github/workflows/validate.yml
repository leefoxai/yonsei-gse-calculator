name: Validate calculator

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Normalize release and apply maintained corrections
        run: python tests/release_maintenance.py

      - name: Refresh modular mobile validation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/validate_packs.py')
          text = path.read_text(encoding='utf-8')
          old = """mobile=(ROOT/'mobile.js').read_text(encoding='utf-8') if (ROOT/'mobile.js').exists() else ''
          check('mobile presentation layer','mobile.js?v=' in html and 'mobile-mode' in mobile and 'mobileImportGuide' in html and 'mobileHistoryCards' in mobile and 'mobilePlanCards' in mobile and 'mobilePlanCoursePicker' in mobile)
          """
          new = """mobile=(ROOT/'mobile.js').read_text(encoding='utf-8') if (ROOT/'mobile.js').exists() else ''
          mobile_base=(ROOT/'mobile-base.js').read_text(encoding='utf-8') if (ROOT/'mobile-base.js').exists() else ''
          mobile_enhancements=(ROOT/'mobile-enhancements.js').read_text(encoding='utf-8') if (ROOT/'mobile-enhancements.js').exists() else ''
          mobile_hotfix=(ROOT/'mobile-hotfix.js').read_text(encoding='utf-8') if (ROOT/'mobile-hotfix.js').exists() else ''
          mobile_png=(ROOT/'mobile-png-fix.js').read_text(encoding='utf-8') if (ROOT/'mobile-png-fix.js').exists() else ''
          mobile_nav=(ROOT/'mobile-action-nav-fix.js').read_text(encoding='utf-8') if (ROOT/'mobile-action-nav-fix.js').exists() else ''
          mobile_bundle='\\n'.join([mobile,mobile_base,mobile_enhancements,mobile_hotfix,mobile_png,mobile_nav])
          check('mobile presentation layer','mobile.js?v=' in html and 'mobile-base.js' in mobile and 'mobile-enhancements.js' in mobile and 'mobile-mode' in mobile_bundle and 'mobileImportGuide' in html and 'mobileHistoryCards' in mobile_bundle and 'mobilePlanCards' in mobile_bundle and 'mobilePlanCoursePicker' in mobile_bundle)
          """
          if old not in text:
              raise SystemExit('mobile validation pattern not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Require generated metadata in pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- index.html styles.css app.js data-pack.json rules-pack.json certificate-rules.json tests/validate_packs.py

      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check mobile.js
          node --check mobile-base.js
          node --check mobile-enhancements.js
          node --check mobile-hotfix.js
          node --check mobile-png-fix.js
          node --check mobile-action-nav-fix.js

      - name: Data and markup validation
        shell: bash
        run: |
          set -o pipefail
          python tests/validate_packs.py | tee validation.log

      - name: Application regression
        shell: bash
        run: |
          set -o pipefail
          node tests/projection_regression.cjs | tee application.log

      - name: Generate regression report
        run: python tests/generate_regression_report.py --validation-log validation.log --application-log application.log

      - name: Commit maintenance output
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- index.html styles.css app.js data-pack.json rules-pack.json certificate-rules.json tests/validate_packs.py REGRESSION_TEST_REPORT.md; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css app.js data-pack.json rules-pack.json certificate-rules.json tests/validate_packs.py REGRESSION_TEST_REPORT.md
          git commit -m "chore: sync release metadata, rules and validation report [skip ci]"
          git push
