name: Prepare 3.2.0 release

on:
  push:
    branches: ['release/3.2.0']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply release corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root=Path('.')
          release=root/'tests/release_maintenance.py'
          s=release.read_text(encoding='utf-8')
          old_title='[테스트]연세대학교 교육대학원 졸업요건 이수현황 계산기'
          new_title='연세대학교 교육대학원 졸업요건 이수현황 계산기'

          s=s.replace(f"CORRECT_TITLE = '{old_title}'", f"CORRECT_TITLE = '{new_title}'")
          if 'LEGACY_TEST_TITLE =' not in s:
              s=s.replace(
                  f"CORRECT_TITLE = '{new_title}'\n",
                  f"CORRECT_TITLE = '{new_title}'\nLEGACY_TEST_TITLE = '{old_title}'\n",
                  1,
              )
          s=s.replace("RELEASE_VERSION = '3.1.18'", "RELEASE_VERSION = '3.2.0'")
          s=s.replace(
              '    text = text.replace(LEGACY_TYPO_TITLE, CORRECT_TITLE)\n',
              '    text = text.replace(LEGACY_TYPO_TITLE, CORRECT_TITLE)\n    text = text.replace(LEGACY_TEST_TITLE, CORRECT_TITLE)\n',
          )
          needle="    text = re.sub(r'<footer class=\\\"footer\\\">\\\\s*<b>v[0-9.]+:</b>',"
          if "3단계 사용흐름', '4단계 사용흐름" not in s:
              marker="    text = text.replace('<th>데이터 상태</th>', '<th>상태</th>', 1)"
              s=s.replace(marker, "    text = text.replace('3단계 사용흐름', '4단계 사용흐름')\n"+marker, 1)
          release.write_text(s,encoding='utf-8')
          PY

          python tests/release_maintenance.py

          python - <<'PY'
          from pathlib import Path
          import re

          # Keep the report-only profile summary printable; hide only the plan-entry controls.
          index=Path('index.html')
          html=index.read_text(encoding='utf-8')
          html=html.replace('class="input-zone no-print-ui step-details" id="inputZone"', 'class="input-zone step-details" id="inputZone"', 1)
          html=html.replace('3단계 사용흐름','4단계 사용흐름')
          index.write_text(html,encoding='utf-8')

          css_path=Path('styles.css')
          css=css_path.read_text(encoding='utf-8')
          css=re.sub(
              r'\n*/\* v3\.1\.19 print interaction cleanup \*/\s*@media print\{\s*\.no-print-ui\{display:none!important\}\s*\}\s*',
              '\n',
              css,
              flags=re.S,
          )
          # Fallback for exact block shape.
          css=css.replace('''\n\n/* v3.1.19 print interaction cleanup */\n@media print{\n  .no-print-ui{display:none!important}\n}\n''','\n')
          marker='/* v3.2.0 print interaction cleanup */'
          if marker not in css:
              css += '''\n\n/* v3.2.0 print interaction cleanup */\n@media print{\n  #planAddSection{display:none!important}\n}\n'''
          css_path.write_text(css,encoding='utf-8')

          validator=Path('tests/validate_packs.py')
          v=validator.read_text(encoding='utf-8')
          old="check('test title applied',\"[테스트]연세대학교 교육대학원 졸업요건 이수현황 계산기\" in html and \"[테스트]연세대학교 교육대학원 졸업요건 이수현황 계산기\" in app)"
          new="check('release title applied',\"연세대학교 교육대학원 졸업요건 이수현황 계산기\" in html and \"연세대학교 교육대학원 졸업요건 이수현황 계산기\" in app and \"[테스트]\" not in html and \"[테스트]\" not in app)"
          v=v.replace(old,new)
          if "check('print controls scoped'" not in v:
              marker="check('action summary navigates to relevant inputs'"
              pos=v.find(marker)
              if pos<0:
                  raise RuntimeError('validator action-summary marker not found')
              line_end=v.find('\n',pos)
              extra=("\ncheck('print controls scoped','#planAddSection{display:none!important}' in css and '.no-print-ui{display:none!important}' not in css and 'class=\\\"input-zone no-print-ui' not in html)"
                     "\ncheck('four-step footer wording','4단계 사용흐름' in html and '3단계 사용흐름' not in html)")
              v=v[:line_end]+extra+v[line_end:]
          validator.write_text(v,encoding='utf-8')
          PY

          python tests/release_maintenance.py

          rm -f .github/workflows/pdf-print-fix.yml
          rm -f tests/apply_pdf_print_fix.py
          rm -f .github/workflows/release-3.2.0.yml

      - name: JavaScript syntax
        run: node --check app.js

      - name: Data and markup validation
        run: python tests/validate_packs.py | tee validation.log

      - name: Application regression
        run: node tests/projection_regression.cjs | tee application.log

      - name: Generate regression report
        run: python tests/generate_regression_report.py --validation-log validation.log --application-log application.log

      - name: Diff sanity
        run: |
          git diff --check
          grep -q 'styles.css?v=3.2.0' index.html
          grep -q 'app.js?v=3.2.0' index.html
          grep -q '4단계 사용흐름' index.html
          ! grep -q '\[테스트\]연세대학교 교육대학원 졸업요건 이수현황 계산기' index.html
          ! grep -q '.no-print-ui{display:none!important}' styles.css
          grep -q '#planAddSection{display:none!important}' styles.css

      - name: Commit release preparation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No release changes'
            exit 0
          fi
          git commit -m "release: prepare 3.2.0 deployment [skip ci]"
          git push
