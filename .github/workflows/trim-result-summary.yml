name: Trim redundant result summary

on:
  push:
    branches: ['fix/trim-result-summary']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: |
          python tests/apply_result_summary_trim.py
          python tests/release_maintenance.py
          rm -f tests/apply_result_summary_trim.py
          rm -f .github/workflows/trim-result-summary.yml
      - name: Validate
        run: |
          node --check app.js
          python tests/validate_packs.py | tee validation.log
          node tests/projection_regression.cjs | tee application.log
          python tests/generate_regression_report.py --validation-log validation.log --application-log application.log
      - name: Sanity checks
        run: |
          grep -q 'styles.css?v=3.2.1' index.html
          grep -q 'app.js?v=3.2.1' index.html
          grep -q '#resultPrimarySummary{display:none!important}' styles.css
          ! grep -q 'result-headline-card' <(python - <<'PY'
          import re
          s=open('app.js',encoding='utf-8').read()
          m=re.search(r'function renderResultPrimarySummary\(\).*?\n}\n',s,re.S)
          print(m.group(0) if m else '')
          PY
          )
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: trim redundant result summary and print actions [skip ci]"
          git push
